run-name: Orchestrate CI workflow
name: Orchestrate CI workflow

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    changes:
        name: Findout which files has changed
        runs-on: ubuntu-latest

        outputs:
            config-server:
            eureka-server:
            api-gateway:
            user-service:
            product-service:
            order-service:
            cart-service:

        steps:
            - name: Checkout the code from GitHub to runner machine
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Filter the services that has code changes
              uses: dorny/paths-filter@v4
              with:
                  filters: |
                      config-server:
                          - 'config-server/**'
                      eureka-server:
                          - 'eureka-server/**'
                      api-gateway:
                          - 'api-gateway/**'
                      user-service:
                          - 'user-service/**'
                      product-service:
                          - 'product-service/**'
                      order-service:
                          - 'order-service/**'
                      cart-service:
                          - 'cart-service/**'

    build-config-server:
        needs: changes
        if: ${{ needs.changes.outputs.config-server == 'true' }}
        name: Build config-server service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: config-server
            service-directory: config-server

    Deploy-config-server:
        needs: build-config-server
        name: Deploy config-server service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: config-server
            service-directory: config-server
    
    build-eureka-server:
        needs: changes
        if: ${{ needs.changes.outputs.eureka-server == 'true' }}
        name: Build eureka-server service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: eureka-server
            service-directory: eureka-server

    Deploy-eureka-server:
        needs: build-eureka-server
        name: Deploy eureka-server service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: eureka-server
            service-directory: eureka-server
    
    build-api-gateway:
        needs: changes
        if: ${{ needs.changes.outputs.api-gateway == 'true' }}
        name: Build api-gateway service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: api-gateway
            service-directory: api-gateway

    Deploy-api-gateway:
        needs: build-api-gateway
        name: Deploy api-gateway service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: api-gateway
            service-directory: api-gateway
    
    build-user-service:
        needs: changes
        if: ${{ needs.changes.outputs.user-service == 'true' }}
        name: Build user-service service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: user-service
            service-directory: user-service
    
    Deploy-user-service:
        needs: build-user-service
        name: Deploy user-service service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: user-service
            service-directory: user-service

    build-product-service:
        needs: changes
        if: ${{ needs.changes.outputs.product-service == 'true' }}
        name: Build product-service service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: product-service
            service-directory: product-service
    
    Deploy-product-service:
        needs: build-product-service
        name: Deploy product-service service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: product-service
            service-directory: product-service

    build-order-service:
        needs: changes
        if: ${{ needs.changes.outputs.order-service == 'true' }}
        name: Build order-service service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: order-service
            service-directory: order-service

    Deploy-order-service:
        needs: build-order-service
        name: Deploy order-service service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: order-service
            service-directory: order-service
    
    build-cart-service:
        needs: changes
        if: ${{ needs.changes.outputs.cart-service == 'true' }}
        name: Build cart-service service
        uses: ./.github/workflows/ci.yaml
        with:
            service-name: cart-service
            service-directory: cart-service

    Deploy-cart-service:
        needs: build-cart-service
        name: Deploy cart-service service
        uses: ./.github/workflows/cd.yaml
        with:
            service-name: cart-service
            service-directory: cart-service

